<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Klee+One:wght@600&family=Darumadrop+One&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#e9dcbc;font-family:"Yusei Magic"}
canvas{position:absolute;left:0;top:0}
.hint{position:absolute;left:1500px;bottom:34px;display:flex;gap:8px;align-items:center;font-size:30px;color:#fff;text-shadow:0 2px 3px #000}
.hint img{height:50px}
.credit{position:absolute;right:48px;top:30px;font-size:21px;color:#6e5b43}
</style>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="credit">音楽 Kevin MacLeod (incompetech.com) CC BY 4.0</div>
<div class="hint"><img src="assets/keyboard_enter.png"><img src="assets/xbox_button_a.png">けってい</div>
<script src="gel.js"></script>
<script>
(async()=>{
const HF='400 100px "Yusei Magic"',DF='400 100px "Darumadrop One"';
await fontReady([[HF,'スライム、跡で本気出す。はじめるスタッフやめるくれじっと'],[DF,'スライム、跡で本気出す。']]);
const [woodA,woodB,paper]=await Promise.all([loadImg('assets/wood_a.jpg'),loadImg('assets/wood_b.jpg'),loadImg('assets/paper.jpg')]);
const x=document.getElementById('c').getContext('2d',{willReadFrequently:true});
// 壁紙
x.fillStyle='#ecdfc3';x.fillRect(0,0,W,H);x.globalCompositeOperation='multiply';x.globalAlpha=.5;x.drawImage(paper,0,0,1920,1920);x.globalAlpha=1;x.globalCompositeOperation='source-over';
x.strokeStyle='rgba(150,120,80,.12)';x.lineWidth=2;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,900);x.stroke()}
// 窓の光が壁に落ちる
x.save();x.globalCompositeOperation='soft-light';x.filter='blur(16px)';x.fillStyle='rgba(255,246,190,.95)';x.beginPath();x.moveTo(760,-30);x.lineTo(1880,-30);x.lineTo(1660,880);x.lineTo(520,880);x.closePath();x.fill();x.restore();
x.save();x.filter='blur(3px)';x.fillStyle='rgba(120,90,50,.13)';x.fillRect(1190,-30,24,920);x.save();x.translate(0,0);x.fillRect(620,340,1260,20);x.restore();x.restore();
// 床: 暖かい板張り
x.save();x.beginPath();x.rect(0,884,W,196);x.clip();x.filter='saturate(1.35) brightness(1.45) sepia(.25)';for(let k=0;k<3;k++)x.drawImage(woodB,k*760,840,780,300);x.restore();
x.fillStyle='#5a3a22';x.fillRect(0,866,W,20);x.fillStyle='#f3e8d0';x.fillRect(0,850,W,18);
// 柱
const PX=120,PW=250;
x.save();x.beginPath();x.rect(PX,0,PW,866);x.clip();x.translate(PX+PW,0);x.rotate(Math.PI/2);x.filter='saturate(1.3) brightness(2.05) sepia(.35)';x.drawImage(woodB,0,0,1024,400,0,0,1000,PW+6);x.restore();
{const g=x.createLinearGradient(PX,0,PX+PW,0);g.addColorStop(0,'rgba(60,30,10,.35)');g.addColorStop(.12,'rgba(60,30,10,0)');g.addColorStop(.9,'rgba(60,30,10,0)');g.addColorStop(1,'rgba(40,20,5,.45)');x.fillStyle=g;x.fillRect(PX,0,PW,866)}
x.fillStyle='rgba(60,40,20,.2)';x.fillRect(PX+PW,0,26,850);
// 鉛筆のしるし = メニュー
function tick(y,label,col,sel){x.save();x.strokeStyle=col;x.lineCap='round';x.lineWidth=sel?11:6;x.beginPath();x.moveTo(PX+18,y+2);x.quadraticCurveTo(PX+110,y-5,PX+PW-14,y+3);x.stroke();
 if(sel){x.beginPath();x.moveTo(PX+22,y+14);x.quadraticCurveTo(PX+110,y+8,PX+PW-20,y+15);x.stroke()}
 if(sel){x.fillStyle='rgba(248,236,190,.9)';x.fillRect(PX-14,y-92,PW+28,84)}x.fillStyle=col;x.font=`400 ${sel?56:46}px "Yusei Magic"`;x.fillText(label,PX+14,y-26);x.restore()}
tick(230,'はじめる','#c5281c',true);tick(398,'スタッフ','#32261c',false);tick(528,'やめる','#32261c',false);
// 古い背くらべの跡
x.strokeStyle='rgba(40,26,16,.7)';x.lineWidth=4;for(const y of [650,716,780]){x.beginPath();x.moveTo(PX+30,y);x.lineTo(PX+140,y-2);x.stroke()}
x.fillStyle='rgba(40,26,16,.85)';x.font='400 26px "Klee One"';x.fillText('5cm',PX+150,788);x.fillText('8cm',PX+150,724);x.fillText('13cm',PX+150,658);
// タイトル: 壁にクレヨンで書いた
const ly=mk(),l=ly.getContext('2d',{willReadFrequently:true});
function crayon(t,X,Y,size,cols,rot=[],stepExtra=0){let px=X;[...t].forEach((ch,i)=>{l.save();const col=cols[i%cols.length],s=size*(1+((i*37)%5-2)*.035);l.font=`400 ${s}px "Darumadrop One"`;const w=l.measureText(ch).width;l.translate(px+w/2,Y+((i*53)%7-3)*5);l.rotate(((i*29)%7-3)*.028);l.fillStyle=col;l.fillText(ch,-w/2,0);l.lineWidth=size*.035;l.strokeStyle=col;l.lineJoin='round';l.strokeText(ch,-w/2,0);l.restore();px+=w*.97+stepExtra})}
crayon('スライム、',520,300,220,['#e0533a','#2a7fc4','#e8a21a','#d94e87','#3b9b3a']);
crayon('跡で',540,560,250,['#2d9c40','#2d9c40']);
crayon('本気出す。',930,560,180,['#1f2933','#e0533a','#2a7fc4','#1f2933','#e8a21a']);
// クレヨンの紙目
{const n=noiseCanvas(2.2,3,2);wear(l,n,.34,.47)}
x.drawImage(ly,0,0);
// 下線の殴り書き
x.strokeStyle='#2d9c40';x.lineWidth=13;x.lineCap='round';x.globalAlpha=.75;x.beginPath();x.moveTo(530,600);for(let i=0;i<9;i++)x.lineTo(540+i*42,604+(i%2)*16);x.stroke();x.globalAlpha=1;
// 積み木
function block(X,Y,w,h,c1,c2,t){x.fillStyle='rgba(30,16,6,.35)';x.filter='blur(7px)';x.fillRect(X+8,Y+h-10,w+20,20);x.filter='none';x.fillStyle=c1;x.fillRect(X,Y,w,h);x.fillStyle=c2;x.beginPath();x.moveTo(X,Y);x.lineTo(X+22,Y-18);x.lineTo(X+w+22,Y-18);x.lineTo(X+w,Y);x.closePath();x.fill();x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.moveTo(X+w,Y);x.lineTo(X+w+22,Y-18);x.lineTo(X+w+22,Y+h-18);x.lineTo(X+w,Y+h);x.closePath();x.fill();if(t){x.fillStyle='#fff';x.font='400 62px "Darumadrop One"';x.textAlign='center';x.fillText(t,X+w/2,Y+h/2+22);x.textAlign='left'}}
block(1540,860,120,120,'#d9423a','#ea6a5c','ス');block(1680,860,120,120,'#2a79bf','#4e98d6','ラ');block(1610,742,120,120,'#e9b022','#f4c84e','イ');
block(540,920,90,90,'#3a9a57','#60b878');
// 寝ているスライム
const s=mk(),c=s.getContext('2d');blob(c,1040,860,300,150);blob(c,1040,950,350,70);blob(c,760,960,60,38);blob(c,1340,958,70,40);
gel(x,s,{smooth:8,height:150,big:60,edge:8,refract:.34,shadow:.62,shadowOff:[6,26],shadowBlur:30,light:[-.5,-.68,.55]});
// 顔: 寝ている
x.strokeStyle='#0b2410';x.lineWidth=11;x.lineCap='round';for(const ex of [960,1120]){x.beginPath();x.arc(ex,850,30,.2,2.94);x.stroke()}
x.beginPath();x.ellipse(1040,898,14,10,0,0,7);x.stroke();
x.fillStyle='#32261c';x.font='400 58px "Darumadrop One"';x.fillText('ぐぅ',1260,762);x.font='400 42px "Darumadrop One"';x.fillText('ぐぅ',1340,700);
// 全体の暖かみ
x.globalCompositeOperation='multiply';x.fillStyle='#fff3df';x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';
done();
})();
</script>
