<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#3a0e12}
canvas{position:absolute}
#wall{left:0;top:0}
.mar{position:absolute;left:300px;top:28px;width:1320px;height:118px;background:#141318;border:8px solid #d6a93e;box-sizing:border-box;display:grid;place-items:center;color:#ffe9a8;font:400 66px/1 "Dela Gothic One";letter-spacing:.2em;box-shadow:0 10px 18px rgba(0,0,0,.6)}
.frame{position:absolute;top:186px;width:640px;height:720px;background:#e7d7b2;border:16px solid #2a1a12;box-sizing:border-box;box-shadow:0 22px 30px rgba(0,0,0,.65);overflow:hidden}
.f1{left:220px;width:720px;height:776px;top:178px;border-color:#d6a93e}
.f2{left:1040px;filter:brightness(.72) saturate(.8)}
.frame canvas{left:0;top:0}
.bar{position:absolute;left:0;right:0;background:#141318;color:#fff0c8;font:800 34px "Shippori Mincho B1";padding:10px 22px}
.vtitle{position:absolute;left:34px;top:18px;font:400 106px/1.04 "Dela Gothic One";color:#fff4d9;-webkit-text-stroke:0;text-shadow:7px 7px 0 #141318,-2px -2px 0 #141318,2px -2px 0 #141318,-2px 2px 0 #141318}
.part{position:absolute;right:26px;top:24px;writing-mode:vertical-rl;font:800 40px/1.1 "Shippori Mincho B1";background:#c8281e;color:#fff4d9;padding:16px 8px}
.info{position:absolute;left:0;right:0;bottom:0;background:#f0e3c0;color:#141318;padding:12px 26px 16px;font:800 30px/1.4 "Shippori Mincho B1"}
.info .rec{font:400 56px/1.1 "Dela Gothic One";color:#c8281e}
.info .row{display:flex;justify-content:space-between;align-items:flex-end}
.soon{position:absolute;left:-60px;top:396px;width:780px;height:120px;background:#c8281e;color:#fff4d9;transform:rotate(-9deg);display:grid;place-items:center;font:400 78px "Dela Gothic One";letter-spacing:.2em;box-shadow:0 8px 12px rgba(0,0,0,.5)}
.foot{position:absolute;left:0;right:0;bottom:0;height:88px;background:#141318;display:flex;gap:44px;align-items:center;padding:0 86px;color:#fff0c8;font:800 30px "Shippori Mincho B1"}
.foot span{display:flex;gap:8px;align-items:center}.foot img{height:50px}.foot .sp{flex:1}
</style>
<body>
<canvas id="wall" width="1920" height="1080"></canvas>
<div class="mar">本日 二本立て</div>
<div class="frame f1"><canvas id="p1" width="688" height="744"></canvas>
 <div class="vtitle">子ども<br>部屋</div><div class="part">第一部</div>
 <div class="info"><div>ベッドの下から、5cm。　上映 3分</div><div class="row"><div>目標 15cm</div><div class="rec">最高 28.4cm</div></div></div></div>
<div class="frame f2"><canvas id="p2" width="608" height="688"></canvas>
 <div class="vtitle" style="font-size:112px">輪の町</div><div class="part">第二部</div>
 <div class="soon">近日公開</div>
 <div class="info"><div>町ごと、飲む。　上映 5分</div><div class="row"><div>目標 50m</div><div class="rec">最高 —</div></div></div></div>
<div class="foot"><span><img src="assets/keyboard_enter.png"><img src="assets/xbox_button_a.png">上映する</span><span><img src="assets/keyboard_arrows_horizontal.png"><img src="assets/xbox_dpad.png">えらぶ</span><span class="sp"></span><span><img src="assets/keyboard_escape.png"><img src="assets/xbox_button_b.png">ロビーへ</span></div>
<script src="gel.js"></script>
<script>
(async()=>{
await fontReady([['400 100px "Dela Gothic One"','子ども部屋輪の町本日二本立て近日公開'],['800 40px "Shippori Mincho B1"','第一部二']]);
const [room,town,paper]=await Promise.all([loadImg('assets/room_meals.jpg'),loadImg('assets/town_big.jpg'),loadImg('assets/paper.jpg')]);
// 壁: 映画館のロビー
const w=document.getElementById('wall').getContext('2d',{willReadFrequently:true});
const g=w.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a1518');g.addColorStop(1,'#260a0c');w.fillStyle=g;w.fillRect(0,0,W,H);
for(let i=0;i<W;i+=64){w.fillStyle=i%128?'rgba(0,0,0,.12)':'rgba(255,190,120,.03)';w.fillRect(i,0,64,H)}
// 選んだ作品に当たる光
const rg=w.createRadialGradient(580,540,60,580,540,800);rg.addColorStop(0,'rgba(255,214,140,.5)');rg.addColorStop(1,'rgba(255,214,140,0)');w.fillStyle=rg;w.fillRect(0,0,W,H);
// 電球
function bulbs(x0,y0,x1,y1,n,on){for(let i=0;i<=n;i++){const X=x0+(x1-x0)*i/n,Y=y0+(y1-y0)*i/n,lit=on&&i%2===0;if(lit){const b=w.createRadialGradient(X,Y,2,X,Y,34);b.addColorStop(0,'rgba(255,230,160,.95)');b.addColorStop(1,'rgba(255,200,90,0)');w.fillStyle=b;w.fillRect(X-34,Y-34,68,68)}w.fillStyle=lit?'#fff4c6':(on?'#c89a3e':'#5f4630');w.beginPath();w.arc(X,Y,10,0,7);w.fill()}}
const L=196,R=964,T=160,B=972;bulbs(L,T,R,T,20,true);bulbs(L,B,R,B,20,true);bulbs(L,T,L,B,22,true);bulbs(R,T,R,B,22,true);
// ポスター
function art(id,img,sx,sy,sw,sh,sky,ink,cell,pre,lift){const cv=document.getElementById(id),x=cv.getContext('2d',{willReadFrequently:true}),cw=cv.width,ch=cv.height;
 x.fillStyle=sky;x.fillRect(0,0,cw,ch);pre(x);x.globalCompositeOperation='multiply';x.globalAlpha=.5;x.drawImage(paper,0,0,cw,cw);x.globalAlpha=1;
 const l=mk(cw,ch),lc=l.getContext('2d',{willReadFrequently:true});halftone(lc,img,sx,sy,sw,sh,0,0,cw,ch,{cell,angle:.5,contrast:1.15,lift,ink});x.drawImage(l,0,0);x.globalCompositeOperation='source-over'}
const green=(x,cx,cy,rx,ry)=>{x.fillStyle='#8fe030';x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()};
art('p1',room,300,0,560,605,'#f0bb2e',[40,18,22],7,x=>{green(x,438,415,222,140)},.2);
art('p2',town,520,130,880,996,'#e04a33',[28,18,30],8,x=>{green(x,310,270,128,104)},.2);
done();
})();
</script>
