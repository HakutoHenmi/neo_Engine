<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Klee+One:wght@600&family=Darumadrop+One&family=Shippori+Mincho+B1:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#ecdfc3;font-family:"Yusei Magic"}
canvas{position:absolute;left:0;top:0}
.card{position:absolute;left:1000px;top:44px;width:830px;height:690px;background:#fbf6e6;box-shadow:0 12px 18px rgba(70,44,20,.32);transform:rotate(1.2deg);color:#2c2a33;padding:34px 44px;box-sizing:border-box}
.card h2{margin:0;font:400 58px "Darumadrop One";border-bottom:5px solid #7da2c8;padding-bottom:6px}
.line{display:grid;grid-template-columns:186px 1fr;align-items:baseline;border-bottom:3px dashed #a9c1d9;padding:14px 0 8px;font-size:32px;width:506px}
.line b{font-weight:400;font:400 70px "Darumadrop One";color:#2c2a33}
.tape{position:absolute;width:190px;height:52px;background:rgba(236,218,150,.72);left:320px;top:-24px;transform:rotate(-2deg)}
.btns{position:absolute;left:1000px;top:778px;width:830px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.b{display:flex;align-items:center;gap:16px;background:#fbf6e6;color:#2c2a33;height:100px;padding:0 18px;font-size:44px;box-shadow:0 7px 0 rgba(70,44,20,.35)}
.b.on{grid-column:1/3;background:#d0301f;color:#fff}
.keys{display:flex;gap:4px;background:#2c2a33;padding:6px 8px;border-radius:7px}.keys img{height:46px}
</style>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="card"><div class="tape"></div>
 <h2>輪の町の ごはん日記</h2>
 <div class="line"><span>おおきさ</span><b>126.31 m</b></div>
 <div class="line"><span>たべた数</span><b>722 こ</b></div>
 <div class="line"><span>町の</span><b>30 ％</b></div>
 <div class="line"><span>のこり時間</span><b>0:45</b></div>
</div>
<div class="btns">
 <div class="b on"><div class="keys"><img src="assets/keyboard_n.png"><img src="assets/xbox_button_a.png"></div>つぎの ページへ</div>
 <div class="b"><div class="keys"><img src="assets/keyboard_r.png"><img src="assets/xbox_button_x.png"></div>もう一回</div>
 <div class="b"><div class="keys"><img src="assets/keyboard_tab.png"><img src="assets/xbox_button_y.png"></div>タイトル</div>
</div>
<canvas id="st" width="1920" height="1080"></canvas>
<script src="gel.js"></script>
<script>
(async()=>{
await fontReady([['400 60px "Darumadrop One"','輪の町のごはん日記きょうきのう'],['600 40px "Klee One"','きのうおとといきょう'],['800 40px "Shippori Mincho B1"','たいへんよくできました']]);
const [woodB,paper]=await Promise.all([loadImg('assets/wood_b.jpg'),loadImg('assets/paper.jpg')]);
const x=document.getElementById('c').getContext('2d',{willReadFrequently:true});
x.fillStyle='#ecdfc3';x.fillRect(0,0,W,H);x.globalCompositeOperation='multiply';x.globalAlpha=.5;x.drawImage(paper,0,0,1920,1920);x.globalAlpha=1;x.globalCompositeOperation='source-over';
x.strokeStyle='rgba(150,120,80,.12)';x.lineWidth=2;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,960);x.stroke()}
// 床
x.save();x.beginPath();x.rect(0,964,W,116);x.clip();x.filter='saturate(1.35) brightness(1.45) sepia(.25)';for(let k=0;k<3;k++)x.drawImage(woodB,k*760,840,780,300);x.restore();
x.fillStyle='#5a3a22';x.fillRect(0,950,W,16);x.fillStyle='#f3e8d0';x.fillRect(0,936,W,16);
// 柱 (幅を広く)
const PX=86,PW=380;
x.save();x.beginPath();x.rect(PX,0,PW,950);x.clip();x.translate(PX+PW,0);x.rotate(Math.PI/2);x.filter='saturate(1.3) brightness(2.05) sepia(.35)';x.drawImage(woodB,0,0,1024,600,0,0,1100,PW+6);x.restore();
{const g=x.createLinearGradient(PX,0,PX+PW,0);g.addColorStop(0,'rgba(60,30,10,.32)');g.addColorStop(.1,'rgba(60,30,10,0)');g.addColorStop(.92,'rgba(60,30,10,0)');g.addColorStop(1,'rgba(40,20,5,.45)');x.fillStyle=g;x.fillRect(PX,0,PW,950)}
x.fillStyle='rgba(60,40,20,.18)';x.fillRect(PX+PW,0,28,936);
// スライム: 背くらべをしている
const s=mk(),c=s.getContext('2d');blob(c,720,640,250,290);blob(c,720,800,300,150);blob(c,700,920,296,62);blob(c,440,950,36,18);
gel(x,s,{smooth:8,height:170,big:64,edge:8,refract:.3,shadow:.55,shadowOff:[8,22],shadowBlur:26,light:[-.5,-.62,.6]});
// 顔: 胸を張る
x.strokeStyle='#0b2410';x.lineWidth=11;x.lineCap='round';for(const ex of [640,800]){x.beginPath();x.arc(ex,600,28,3.5,5.9);x.stroke()}
x.beginPath();x.arc(720,640,32,.3,2.84);x.stroke();
// 過去のしるし
function tick(y,label,col,w=6,len=250,size=38){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(PX+20,y);x.quadraticCurveTo(PX+130,y-6,PX+len,y+3);x.stroke();x.fillStyle=col;x.font=`600 ${size}px "Klee One"`;x.fillText(label,PX+26,y-12)}
tick(832,'はじめて 1 m','#21160d');tick(690,'おととい 50 m','#21160d');tick(548,'きのう 95 m','#21160d');
// 今回: 赤いしるしを スライムの頭の高さに
x.strokeStyle='#c5281c';x.lineWidth=15;x.lineCap='round';x.beginPath();x.moveTo(PX+16,346);x.quadraticCurveTo(PX+200,336,560,340);x.stroke();x.lineWidth=11;x.beginPath();x.moveTo(PX+24,362);x.quadraticCurveTo(PX+200,352,540,358);x.stroke();
x.fillStyle='rgba(248,236,190,.92)';x.fillRect(PX-14,130,PW+40,204);x.fillStyle='#c5281c';x.font='400 108px "Darumadrop One"';x.fillText('きょう',PX+30,226);x.font='400 84px "Darumadrop One"';x.fillText('126.31m',PX+30,318);
// 花丸とはんこ
const t=document.getElementById('st').getContext('2d',{willReadFrequently:true});
// 花丸: ふち飾りの 1 本線と、書き終わりのしっぽ
t.save();t.translate(1660,288);t.rotate(-.1);t.strokeStyle='#d0301f';t.lineWidth=10;t.lineCap='round';t.lineJoin='round';
t.beginPath();for(let a=0;a<=6.75;a+=.03){const r=120+Math.abs(Math.sin(a*4.5))*30,px=Math.cos(a-1.4)*r,py=Math.sin(a-1.4)*r;a?t.lineTo(px,py):t.moveTo(px,py)}t.lineTo(210,-120);t.stroke();
t.fillStyle='#d0301f';t.font='400 170px "Darumadrop One"';t.textAlign='center';t.textBaseline='middle';t.fillText('S',0,8);t.restore();
// たいへんよくできました
t.save();t.translate(1660,572);t.rotate(-.07);t.strokeStyle='#d0301f';t.lineWidth=8;t.strokeRect(-158,-76,316,152);t.lineWidth=3;t.strokeRect(-148,-66,296,132);t.fillStyle='#d0301f';t.font='800 38px "Shippori Mincho B1"';t.textAlign='center';t.fillText('たいへん',0,-8);t.fillText('よくできました',0,40);t.restore();
done();
})();
</script>
