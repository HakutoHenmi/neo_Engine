<!doctype html><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<body style="margin:0"><canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
// 物差しの画面で使う小道具・スライム・ロゴを透明の PNG にして bake_sprites.py へ送る
import {THREE,model,place,toy,slime,GLYPH,drawGlyph} from './scene3d.js';
const save=async(name,cv)=>{await fetch('/save/'+name,{method:'POST',body:cv.toDataURL('image/png')})};
const cv=document.getElementById('c'),r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(1024,1024,false);r.setClearColor(0,0);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
const {RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js');
const sc=new THREE.Scene();sc.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;sc.environmentIntensity=.9;
const sun=new THREE.DirectionalLight(0xfff2dc,2.6);sun.position.set(2,10,24);sc.add(sun);
const cam=new THREE.OrthographicCamera(-.75,.75,.75,-.75,.1,50);cam.position.set(0,0,10);cam.lookAt(0,0,0);
const list=[['rat','street_rat'],['jerrycan','metal_jerrycan'],['tyre','old_tyre'],['barrel','Barrel_01'],['hydrant','fire_hydrant'],['box','cardboard_box_01'],['cat','concrete_cat_statue'],['car','covered_car'],['horse','horse_statue_01'],['barrier','concrete_road_barrier']];
for(const [name,file] of list){const t=await model(file);const m=place(t,1.3,[0,0,0],[0,.5,0]);sc.add(m);await new Promise(ok=>setTimeout(ok,1500));r.render(sc,cam);await save(name,cv);sc.remove(m)}
for(const [name,kind,color] of [['block','box',0xd9423a],['ball','ball',0x2fa58a]]){const m=place(toy(kind,color),.9,[0,0,0],[kind==='box'?.2:0,.5,0]);sc.add(m);r.render(sc,cam);await save(name,cv);sc.remove(m)}

// ロゴ: 100 の升の外へ 8 だけ余白を取って描く
for(const [i,ch] of ['チ','リ','ツ','モ'].entries()){const c=document.createElement('canvas');c.width=c.height=696;const x=c.getContext('2d');x.strokeStyle='#fff';drawGlyph(x,ch,48,48,600,20);await save('logo'+i,c)}
document.title='done';await fetch('/done',{method:'POST'});
</script>
