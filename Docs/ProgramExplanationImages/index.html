<main>
<h1>SLIME ASSAULT / プログラム説明用画像</h1>
<p>2026年9月27日撮影。実際のゲーム描画を保存した1920 × 1080のPNG画像。</p>
<h2>1. 通常移動・ジャンプ・着地</h2>
<div class="grid">
<figure><a href="01-move.png"><img src="01-move.png" alt="通常移動中のスライム"></a><figcaption><strong>01 通常移動</strong>丸みを保ちながら移動し、接触した地面に軌跡を残す。</figcaption></figure>
<figure><a href="02-jump.png"><img src="02-jump.png" alt="空中で縦に伸びたスライム"></a><figcaption><strong>02 ジャンプ</strong>空中で体が縦に伸びる。地面から離れた状態と輪郭の変化を示す。</figcaption></figure>
<figure><a href="03-land.png"><img src="03-land.png" alt="着地で横に広がったスライム"></a><figcaption><strong>03 着地</strong>接地直後に体が低く、横に広がる。ジャンプ画像との対比に使用。</figcaption></figure>
</div>
<p class="note">通常移動とジャンプ・着地では場所と体内質量が異なります。形状変化を示す場面比較です。同じ場所・同じ質量での基準形状は<a href="00-rest.png">静止状態の補助画像</a>を使用してください。</p>
<h2>2. 軌跡を回収してビームを発射</h2>
<div class="grid sequence">
<figure><a href="04-trail.png"><img src="04-trail.png" alt="地面に残った移動の軌跡"></a><figcaption><strong>04 軌跡を残す</strong>移動によって体の質量を地面へ預ける。HUDのTRAILは地面に残した量。</figcaption></figure>
<figure><a href="05-recall.png"><img src="05-recall.png" alt="地面の軌跡を回収している場面"></a><figcaption><strong>05 回収・圧縮</strong>軌跡を回収して攻撃を準備する。TRAILの減少、BODYの増加、チャージ表示を比較。</figcaption></figure>
<figure><a href="06-charged.png"><img src="06-charged.png" alt="レベル3まで回収と圧縮が進んだ場面"></a><figcaption><strong>06 高出力チャージ</strong>回収が進み、レベル3に到達した発射直前の状態。</figcaption></figure>
<figure><a href="07-beam.png"><img src="07-beam.png" alt="レベル3のビームを発射する場面"></a><figcaption><strong>07 ビーム発射</strong>回収した量に応じたビームとリングの演出。移動・回収・攻撃のつながりを示す。</figcaption></figure>
</div>
<p class="note">04〜07は同じプレイ中の順序に沿った画像です。軌跡とビームの形を見せるため、撮影モードでカメラを斜め上へ変更しています。画像の合成・描き足し・色補正は行っていません。通常のゲーム処理を入力再生で動かして撮影しています。</p>
</main>
